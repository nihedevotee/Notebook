<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Notebook Workspace</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="appShell" class="app-shell">
      <aside id="sidebar" class="sidebar">
        <div class="sidebar-top">
          <div class="brand-block">
            <p class="eyebrow">Notebook Workspace</p>
            <h1>Projects</h1>
            <p class="brand-subtitle">Write, sketch, export.</p>
          </div>
          <button id="sidebarToggle" class="icon-button" type="button" data-tooltip="Toggle Sidebar" data-toolbar-action="sidebar-toggle">☰</button>
        </div>

        <div class="sidebar-actions">
          <button id="newProjectBtn" class="sidebar-action-btn" type="button" data-toolbar-action="new-project" data-tooltip="New Project">
            <span class="sidebar-action-icon">📁</span>
            <span class="sidebar-action-label">New Project</span>
          </button>
          <button id="newPageBtn" class="sidebar-action-btn" type="button" data-toolbar-action="new-page" data-tooltip="New Page">
            <span class="sidebar-action-icon">📄</span>
            <span class="sidebar-action-label">New Page</span>
          </button>
        </div>

        <section class="sidebar-section">
          <div class="section-title-row">
            <h2>Projects</h2>
            <span class="section-hint">Click to open pages</span>
          </div>
          <div id="projectList" class="project-list"></div>
        </section>

        <section class="sidebar-section">
          <div class="section-title-row">
            <h2>Palettes</h2>
            <span class="section-hint">Color Hunt inspired</span>
          </div>
          <div class="palette-trigger-row">
            <button id="paletteToggleBtn" class="icon-btn" type="button" data-toolbar-action="toggle-palette" data-tooltip="Paper Palette" aria-haspopup="true" aria-expanded="false">
              <span class="icon-glyph" aria-hidden="true">🎨</span>
            </button>
            <span id="paletteActiveName" class="palette-active-name">Soft Pastel</span>
            <div id="paletteMenu" class="palette-menu" hidden></div>
          </div>
        </section>
      </aside>

      <button id="scrim" class="scrim" type="button" aria-label="Close sidebar"></button>

      <main class="workspace">
        <header class="toolbar">
          <div class="toolbar-left">
            <div class="document-head">
              <div id="projectTitle" class="document-title">Notebook</div>
              <div id="pageTitle" class="document-subtitle">Page</div>
            </div>
          </div>

          <div class="toolbar-right">
            <div class="color-group">
              <span class="group-label">Ink</span>
              <div id="colorSwatches" class="color-swatches"></div>
            </div>

            <div class="brush-group">
              <span class="group-label">Brush</span>
              <select id="toolSelect" class="tool-select" title="Choose brush style">
                <option value="pen">Pen</option>
                <option value="brush">Brush</option>
                <option value="oilPastel">Oil Pastel</option>
                <option value="marker">Marker</option>
                <option value="pencil">Pencil</option>
                <option value="highlighter">Highlighter</option>
              </select>
            </div>

            <div class="brush-group">
              <span class="group-label">Size</span>
              <input id="brushSize" class="brush-slider" type="range" min="1" max="28" value="4" />
            </div>

            <div class="brush-group zoom-group">
              <span class="group-label">Zoom</span>
              <div class="zoom-control" title="Adjust writing area zoom">
                <span class="zoom-icon" aria-hidden="true">🔍</span>
                <input id="zoomSlider" class="zoom-slider" type="range" min="75" max="150" value="100" step="5" />
                <span id="zoomValue" class="zoom-value">100%</span>
              </div>
            </div>

            <div class="tool-strip">
              <button id="penBtn" class="icon-btn primary is-active" type="button" data-toolbar-action="pen" data-tooltip="Pen"><span class="icon-glyph">✏️</span></button>
              <button id="moveBtn" class="icon-btn" type="button" data-toolbar-action="move" data-tooltip="Move / Resize"><span class="icon-glyph">✋</span></button>
              <button id="eraserBtn" class="icon-btn" type="button" data-toolbar-action="eraser" data-tooltip="Eraser"><span class="icon-glyph">🧹</span></button>
              <button id="undoBtn" class="icon-btn" type="button" data-toolbar-action="undo" data-tooltip="Undo"><span class="icon-glyph">↩️</span></button>
              <button id="redoBtn" class="icon-btn" type="button" data-toolbar-action="redo" data-tooltip="Redo"><span class="icon-glyph">↪️</span></button>
              <button id="saveBtn" class="icon-btn" type="button" data-toolbar-action="save" data-tooltip="Save"><span class="icon-glyph">💾</span></button>
              <button id="uploadImageBtn" class="icon-btn" type="button" data-toolbar-action="upload-image" data-tooltip="Upload Picture"><span class="icon-glyph">📷</span></button>
              <button id="removeImageBtn" class="icon-btn" type="button" data-toolbar-action="remove-image" data-tooltip="Remove Picture"><span class="icon-glyph">🗑️</span></button>

              <button id="themeToggle" class="icon-btn ghost" type="button" data-toolbar-action="theme-toggle" data-tooltip="Toggle Dark Mode"><span class="icon-glyph">🌙</span></button>
              <div class="export-group">
                <button id="exportBtn" class="icon-btn" type="button" data-toolbar-action="export" data-tooltip="Export" aria-haspopup="true" aria-expanded="false"><span class="icon-glyph">⬇️</span></button>
                <div id="exportMenu" class="export-menu" hidden>
                  <button type="button" data-toolbar-action="export-pdf">📄 Download PDF...</button>
                  <button type="button" data-toolbar-action="export-png">🖼️ Save current page as PNG</button>
                </div>
                <div id="pdfChoiceModal" class="pdf-choice-modal" hidden>
                  <div class="pdf-choice-card">
                    <h3>Download PDF</h3>
                    <p>Sir, what would you like to download?</p>
                    <div class="pdf-choice-actions">
                      <button type="button" id="pdfThisPageBtn">PDF of this page only</button>
                      <button type="button" id="pdfWholeProjectBtn">PDF of whole project</button>
                      <button type="button" id="pdfCancelBtn" class="ghost">Cancel</button>
                    </div>
                  </div>
                </div>
              </div>
              <button id="clearBtn" class="icon-btn danger" type="button" data-toolbar-action="clear" data-tooltip="Clear Page"><span class="icon-glyph">🗑️</span></button>
            </div>
          </div>
        </header>

        <section class="paper-shell">
          <div class="paper-frame">
            <div id="imageLayer" class="image-layer" aria-hidden="true"></div>
            <canvas id="board"></canvas>
            <div class="paper-overlay"></div>
          </div>
        </section>

        <footer id="status" class="status-pill">Autosaves locally in this browser.</footer>
      </main>
    </div>

    <input id="pictureInput" type="file" accept="image/*" hidden />
    <script type="module" src="./app.js"></script>
  </body>
</html>
