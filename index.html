<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Notebook Workspace</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="appShell" class="app-shell">
      <aside id="sidebar" class="sidebar">
        <div class="sidebar-top">
          <div class="brand-block">
            <p class="eyebrow">Notebook Workspace</p>
            <h1>Projects</h1>
            <p class="brand-subtitle">Write, sketch, export.</p>
          </div>
          <button id="sidebarToggle" class="icon-button" type="button" title="Toggle sidebar" data-toolbar-action="sidebar-toggle">☰</button>
        </div>

        <div class="sidebar-actions">
          <button id="newProjectBtn" class="small-button primary" type="button" data-toolbar-action="new-project"><span class="btn-icon">＋</span><span class="btn-label">New Project</span></button>
          <button id="newPageBtn" class="small-button" type="button" data-toolbar-action="new-page"><span class="btn-icon">▣</span><span class="btn-label">New Page</span></button>
        </div>

        <section class="sidebar-section">
          <div class="section-title-row">
            <h2>Projects</h2>
            <span class="section-hint">Click to open pages</span>
          </div>
          <div id="projectList" class="project-list"></div>
        </section>

        <section class="sidebar-section">
          <div class="section-title-row">
            <h2>Palettes</h2>
            <span class="section-hint">Color Hunt inspired</span>
          </div>
          <div id="paletteList" class="palette-list"></div>
        </section>
      </aside>

      <button id="scrim" class="scrim" type="button" aria-label="Close sidebar"></button>

      <main class="workspace">
        <header class="toolbar">
          <div class="toolbar-left">
            <div class="document-head">
              <div id="projectTitle" class="document-title">Notebook</div>
              <div id="pageTitle" class="document-subtitle">Page</div>
            </div>
          </div>

          <div class="toolbar-right">
            <div class="color-group">
              <span class="group-label">Ink</span>
              <div id="colorSwatches" class="color-swatches"></div>
            </div>

            <div class="brush-group">
              <span class="group-label">Size</span>
              <input id="brushSize" class="brush-slider" type="range" min="1" max="22" value="4" />
            </div>

            <div class="tool-strip">
              <button id="penBtn" class="tool-button primary is-active" type="button" data-toolbar-action="pen" title="Pen">Pen</button>
              <button id="eraserBtn" class="tool-button" type="button" data-toolbar-action="eraser" title="Eraser">Eraser</button>
              <button id="undoBtn" class="tool-button" type="button" data-toolbar-action="undo" title="Undo">Undo</button>
              <button id="redoBtn" class="tool-button" type="button" data-toolbar-action="redo" title="Redo">Redo</button>
              <button id="beautifyBtn" class="tool-button" type="button" data-toolbar-action="beautify" title="Refine Handwriting">Refine</button>
              <button id="saveBtn" class="tool-button" type="button" data-toolbar-action="save" title="Save">Save</button>
              <button id="themeToggle" class="tool-button ghost" type="button" data-toolbar-action="theme-toggle" title="Toggle dark mode">🌙 Dark</button>
              <div class="export-group">
                <button id="exportBtn" class="tool-button" type="button" data-toolbar-action="export" title="Export options" aria-haspopup="true" aria-expanded="false">Export ▾</button>
                <div id="exportMenu" class="export-menu" hidden>
                  <button type="button" data-toolbar-action="export-pdf">📄 Download as PDF</button>
                  <button type="button" data-toolbar-action="export-png">🖼️ Save page as PNG</button>
                </div>
              </div>
              <button id="clearBtn" class="tool-button danger" type="button" data-toolbar-action="clear" title="Clear current page">Clear</button>
            </div>
          </div>
        </header>

        <section class="paper-shell">
          <div class="paper-frame">
            <canvas id="board"></canvas>
            <div class="paper-overlay"></div>
          </div>
        </section>

        <footer id="status" class="status-pill">Autosaves locally in this browser.</footer>
      </main>
    </div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
